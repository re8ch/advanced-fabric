apiVersion: governance.re8ch.com/v1alpha1
kind: ProjectBinding
metadata:
  name: advanced-fabric
spec:
  parent:
    catalog: platform
    repository: git@gitlab.com:reachievellc/service-backend.git
    catalogPath: catalogs/platform/modules/advanced-fabric
    submodulePath: catalogs/platform/modules/advanced-fabric/source
  identity:
    maintainerAddress: advanced-fabric-maintain@phonaid.com
    accountClass: project-maintainer
    googleWorkspacePolicy: eligible
  workspace:
    name: advanced-fabric-maintain
    oneActivePerAccount: true
    branchPrefix: workspace/advanced-fabric-maintain/
  contract:
    transport: branch-pull-request
    completion: pull-request-closed
    evidenceAuthority: kubernetes
