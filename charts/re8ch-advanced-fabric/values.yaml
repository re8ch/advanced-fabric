fabric:
  enabled: false
stage: 0
pool:
  name: network-service-vip
  cidr: ""
  enabled: false
canary:
  enabled: false
  namespace: kube-system
  address: ""
advertisement:
  labels:
    network-fabric.example/lb-pool: service-vip
    network-fabric.example/bgp-advertise: enabled
peer:
  timers: {connectRetry: 3, hold: 9, keepAlive: 3}
  gracefulRestartSeconds: 30
nodes: {}
routerOS:
  enabled: false
  namespace: kube-system
  credentialsSecret: {namespace: ops, name: mikrotik-routeros-admin}
  nodeSelector: {}
advancedFabric:
  enabled: false
  mode: observe-only
  applyEnabled: false
  observeDays: 7
  emergencyDisable: false
  timezone: Asia/Shanghai
  nativeRoutingCIDR: 10.42.0.0/16
  acceleratedCIDR: 10.250.0.0/24
  serviceCIDR: 10.251.0.0/24
  controlPlaneApi:
    enabled: false
    vip: ""
    port: 6443
    mode: healthy-ecmp
    eligibleNodes: []
    guardedNodes: []
    nodeOperations: []
    primaryTransport: wireguard
    fallbackTransport: zerotier
    healthCheck:
      address: 127.0.0.1
      path: /readyz
      intervalSeconds: 5
      timeoutSeconds: 2
      successThreshold: 3
      failureThreshold: 3
      withdrawDelaySeconds: 0
  weightedEcmp:
    enabled: false
  controller:
    nodeSelector: {}
  dns:
    enabled: false
    image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
    replicas: 3
    pdbMinAvailable: 2
    clusterDomain: cluster.local
    ttlSeconds: 30
    upstreams: [223.5.5.5, 119.29.29.29, 1.1.1.1]
    service: {name: advanced-fabric-dns, clusterIP: 10.43.65.40}
    doh: {serviceName: advanced-fabric-doh, caSecretName: advanced-fabric-doh-tls}
    migration: {phase: shadow}
  networkQuality:
    enabled: false
    # Observe and retain a baseline before turning measurements into gates.
    enforcementEnabled: false
    victoriaMetricsServiceScrape: true
    intervalSeconds: 30
    timeoutSeconds: 2
    samples: 3
    freshnessSeconds: 120
    minimumCoverageRatio: 1.0
    maximumLossRatio: 0.0
    maximumRegionalP95Ms: 20
    maximumCrossRegionP95Ms: 400
    dns:
      maximumFailureRatio: 0.001
      maximumP95Ms: 50
      requireTcp: true
      shadowEnabled: false
      shadowServiceName: advanced-fabric-dns
    doh:
      enabled: false
      url: https://advanced-fabric-doh.kube-system.svc.cluster.local/dns-query
      caSecretName: advanced-fabric-doh-tls
      maximumFailureRatio: 0.001
      maximumP95Ms: 100
  policyRouting:
    tables: {fastest: 201, balanced: 202, greedy: 203}
    marks: {fastest: 42241, balanced: 42242, greedy: 42243}
  nodes: []
headlampPlugin:
  enabled: false
  namespace: headlamp
  pluginsPVC: headlamp-plugins
  installImage: registry.k8s.io/busybox:1.36.1
# Optional regional egress. This does not proxy cluster, Ceph, etcd or private
# traffic. Supply an existing Secret containing paths.yaml with encrypted
# proxy-provider transports; the chart never packages provider credentials.
mihomoGateway:
  enabled: false
  image:
    repository: metacubex/mihomo
    tag: v1.19.29
    pullPolicy: IfNotPresent
  capabilityLabel: networking.re8ch.com/mihomo-node
  capabilityValue: enabled
  existingPathsSecret: ""
  service:
    type: ClusterIP
    requestedLoadBalancerIP: ""
    externalTrafficPolicy: Local
    advertise: false
  controller:
    enabled: true
  rules:
    overseasDomains:
      - github.com
      - githubusercontent.com
      - ghcr.io
      - quay.io
      - registry.k8s.io
      - pkg.dev
      - docker.io
      - docker.com
      - amazonaws.com
