apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: advancedfabrics.networking.re8ch.com}
spec:
  group: networking.re8ch.com
  scope: Cluster
  names: {plural: advancedfabrics, singular: advancedfabric, kind: AdvancedFabric, shortNames: [afabric]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [mode, nativeRoutingCIDR, acceleratedCIDR, serviceCIDR, nodes]
              properties:
                mode: {type: string, enum: [observe-only, guarded-apply]}
                applyEnabled: {type: boolean}
                emergencyDisable: {type: boolean}
                nativeRoutingCIDR: {type: string}
                acceleratedCIDR: {type: string}
                serviceCIDR: {type: string}
                controlPlaneApi:
                  type: object
                  required: [enabled, vip, port, mode, eligibleNodes, primaryTransport, fallbackTransport, healthCheck]
                  properties:
                    enabled: {type: boolean}
                    vip: {type: string, pattern: '^$|^10\.250\.0\.[0-9]{1,3}/32$'}
                    port: {type: integer, enum: [6443]}
                    mode: {type: string, enum: [healthy-ecmp]}
                    eligibleNodes: {type: array, uniqueItems: true, items: {type: string}}
                    primaryTransport: {type: string, enum: [wireguard]}
                    fallbackTransport: {type: string, enum: [zerotier]}
                    healthCheck: {type: object, x-kubernetes-preserve-unknown-fields: true}
                observeDays: {type: integer, minimum: 0}
                timezone: {type: string}
                controller: {type: object, x-kubernetes-preserve-unknown-fields: true}
                weightedEcmp: {type: object, x-kubernetes-preserve-unknown-fields: true}
                policyRouting: {type: object, x-kubernetes-preserve-unknown-fields: true}
                nodes: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: trafficpolicies.networking.re8ch.com}
spec:
  group: networking.re8ch.com
  scope: Namespaced
  names: {plural: trafficpolicies, singular: trafficpolicy, kind: TrafficPolicy, shortNames: [tpolicy]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Profile, type: string, jsonPath: .spec.profile}
        - {name: Ready, type: string, jsonPath: ".status.conditions[0].status"}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [podSelector, destination, profile]
              properties:
                podSelector: {type: object, x-kubernetes-preserve-unknown-fields: true}
                destination:
                  type: object
                  properties:
                    cidrs: {type: array, items: {type: string}}
                    class: {type: string, enum: [cluster, public-internet]}
                  anyOf:
                    - required: [cidrs]
                    - required: [class]
                profile: {type: string, enum: [fastest, balanced, greedy]}
                fallbackProfile: {type: string, enum: [fastest, balanced, greedy], default: balanced}
                priority: {type: integer, minimum: 0, maximum: 100000, default: 100}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
