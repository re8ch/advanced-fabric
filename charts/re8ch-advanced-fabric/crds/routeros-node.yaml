apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: routerosnodes.networking.re8ch.com}
spec:
  group: networking.re8ch.com
  scope: Cluster
  names: {plural: routerosnodes, singular: routerosnode, kind: RouterOSNode, shortNames: [rosnode]}
  conversion: {strategy: None}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
    - name: v1alpha2
      served: true
      storage: false
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Mode, type: string, jsonPath: ".spec.mode"}
        - {name: Ready, type: string, jsonPath: ".status.conditions[0].status"}
        - {name: Safety, type: string, jsonPath: ".status.safety"}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [nodeRef, routerAddress, routerASN, mode, routeDomains, peers, protectedPrefixes, publicVIPs, continuity]
              properties:
                nodeRef: {type: string, minLength: 1}
                routerAddress: {type: string, format: ipv4}
                routerASN: {type: integer, format: int64, minimum: 1}
                mode: {type: string, enum: [Observe, GuardedApply]}
                credentialsSecretRef:
                  type: object
                  required: [name, namespace]
                  properties:
                    name: {type: string, minLength: 1}
                    namespace: {type: string, minLength: 1}
                apply:
                  type: object
                  properties:
                    enabled: {type: boolean, default: false}
                    checksum: {type: string, pattern: '^$|^[a-f0-9]{64}$'}
                continuity:
                  type: object
                  required: [operatorWitness, mainDefaultGateway, mainDefaultInterface, requireExternalProbe]
                  properties:
                    operatorWitness: {type: string, minLength: 1}
                    mainDefaultGateway: {type: string, format: ipv4}
                    mainDefaultInterface: {type: string, minLength: 1}
                    requireExternalProbe: {type: boolean, enum: [true]}
                routeDomains:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, fib, prefixes, fallbackTable]
                    properties:
                      name: {type: string, pattern: '^re8ch-[a-z0-9-]+$'}
                      fib: {type: boolean}
                      prefixes: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
                      fallbackTable: {type: string, enum: [main]}
                peers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, role, address, remoteASN, localAddress, acceptedPrefixes, maxPrefixes, routeDomain, failurePolicy]
                    properties:
                      name: {type: string, minLength: 1}
                      role: {type: string, enum: [r640-public-origin, cluster-route-server, cluster-worker]}
                      address: {type: string}
                      remoteASN: {type: integer, format: int64, minimum: 1}
                      localAddress: {type: string, format: ipv4}
                      acceptedPrefixes: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
                      maxPrefixes: {type: integer, minimum: 1, maximum: 256}
                      routeDomain: {type: string}
                      useBFD: {type: boolean, default: false}
                      keepaliveTime: {type: string, default: 10s}
                      holdTime: {type: string, default: 30s}
                      gracefulRestartSeconds: {type: integer, minimum: 0, maximum: 300, default: 30}
                      failurePolicy: {type: string, enum: [WithdrawPeerOnly]}
                protectedPrefixes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string}
                fallbackNextHop: {type: string, format: ipv4}
                publicVIPs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [cidr, owner, fallbackDistance, healthAuthority]
                    properties:
                      cidr: {type: string}
                      owner: {type: string, enum: [r640]}
                      fallbackDistance: {type: integer, minimum: 100, maximum: 254}
                      healthAuthority: {type: string, enum: [GatewayServiceProbe]}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
