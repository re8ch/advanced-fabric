apiVersion: v2
name: advanced-fabric
description: Public, observe-first Cilium and FRR fabric control and network evidence API
type: application
version: 0.26.0
appVersion: "0.26.0"
kubeVersion: ">=1.30.0-0"
home: https://github.com/re8ch/advanced-fabric
sources:
  - https://github.com/re8ch/advanced-fabric
maintainers:
  - name: RE8CH
    url: https://github.com/re8ch
keywords: [cilium, bgp, frr, ecmp, k3s, multi-region, networking]
annotations:
  networking.advfab.org/scope: advanced-fabric
  networking.advfab.org/compatible-release: advanced-fabric
  artifacthub.io/license: MIT
  artifacthub.io/category: networking
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: deep insights
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: Publish the storage-neutral Advanced Fabric observation API and advertise it through AdvancedFabric status for public UI consumers.
    - kind: changed
      description: Move public CRDs to networking.advfab.org, retain networking.re8ch.com dual-publication for this minor, and remove deployment-specific defaults.
    - kind: changed
      description: Package the data-only Headlamp client with producer-owned synchronized relationship coordinates.
    - kind: fixed
      description: Let offline non-origin host transactions converge when their node returns without blocking healthy guarded control-plane VIP origins.
    - kind: fixed
      description: Scope guarded control-plane VIP safety to participating transaction nodes so unrelated unavailable spines do not block healthy ECMP convergence.
    - kind: fixed
      description: Exclude FRR on-link next-hop sentinels from active-probe completeness so fully measured nodes can close n_nh.
    - kind: fixed
      description: Close b_rx with reset-safe node-local Hubble and Cilium Envoy windows, cluster-wide adapter discovery, and explicit evidence dimensions without synthesizing missing traffic.
    - kind: fixed
      description: Make the DNS Helm test node placement explicit so an unrelated node sandbox failure cannot non-deterministically roll back an otherwise healthy observation release.
    - kind: changed
      description: Close the observation model by treating quiet event-conditioned windows as valid right-censored observations and unreachable next hops as measured outcomes without fabricating numeric durations.
    - kind: fixed
      description: Read the canonical Envoy listener receive-byte counter from node-labelled Gateway metric targets when building b_rx windows.
    - kind: added
      description: Gate per-node tracking on 31/31 valid measurements and publish observation-derived values in original units for 90-day Prometheus queries.
    - kind: added
      description: Retain naturally occurring network changes as NetworkObservationEpisode resources and derive convergence, persistence and recovery only from completed episodes.
    - kind: added
      description: Collect Service receive bytes, restart-aware FRR deltas, timestamped RIB/FIB changes and bound next-hop reachability evidence without inducing route disturbances.
    - kind: fixed
      description: Keep NPA reachability eligible when each fresh host and pod plane has a viable path, without allowing an unrelated offline matrix target to reject the node.
    - kind: changed
      description: Replace generated O/S/I scores with an evidence-first Trade-off Observatory and open, identification-gated triangles.
    - kind: added
      description: Add NetworkIntervention, NetworkTradeoffEstimate and TradeoffTriangle APIs plus Prometheus structural-evidence metrics.
    - kind: changed
      description: Publish NetworkPathAssessment v1alpha2 as freshness and reachability eligibility evidence for consumers such as PublicEdge.
    - kind: fixed
      description: Use the FRR 10.x-compatible BGP neighbor JSON command so node status and the 31-symbol measurement envelope publish successfully.
    - kind: added
      description: Publish a complete 31-symbol per-node measurement envelope with observed, partial, and not-observed evidence states.
    - kind: added
      description: Collect Linux route, nexthop and interface snapshots plus richer FRR path attributes without fabricating experiment-only measurements.
    - kind: added
      description: Calculate Service O/S/I from timestamped incoming-traffic windows with explicit values, rates, confidence, and formula operands.
    - kind: added
      description: Publish Service-scoped NetworkPathAssessments while preserving missing or stale traffic evidence as unknown.
    - kind: fixed
      description: Grant the virtual Ingress controller read access to Gateway resources so two-phase Traefik adoption can validate its target listener.
    - kind: added
      description: Two-phase Traefik Ingress adoption after generated Gateway routes become Accepted and ResolvedRefs, with explicit exclusions and literal Nuclio path compatibility.
    - kind: added
      description: Opt-in virtual IngressClass adapter that translates supported legacy Ingress resources into owned Gateway API HTTPRoutes without a proxy data plane.
    - kind: fixed
      description: Pin every externally sourced runtime image by immutable OCI index digest and make the Artifact Hub image inventory match rendered workloads.
    - kind: fixed
      description: Replace the unavailable registry.k8s.io BusyBox reference used by the optional Headlamp installer with the digest-pinned Docker Official Image.
    - kind: fixed
      description: Make measurement freshness sampling-duration-aware, probe paths concurrently, and keep evidence tasks pending until their formal requirements are satisfied.
    - kind: added
      description: Support explicitly declared same-destination feasible alternative paths without substituting unrelated targets.
    - kind: added
      description: Publish a self-contained, consumer-neutral NetworkPathAssessment API from the closed measurement and inference loop.
    - kind: added
      description: Persist bounded timestamped normalized O/S/I history for shared visual evolution.
    - kind: fixed
      description: Prune legacy desired-state keys for nodes absent from current cluster membership and CR inventory.
    - kind: fixed
      description: Decouple controller API access from the measured accelerated dataplane VIP.
    - kind: added
      description: Controller-driven Evidence Planner and cluster-fact membership reconciliation.
    - kind: added
      description: Evidence pipeline with historical stability, failure-domain independence, rule-based diagnosis, confidence, recommendation, and post-change validation.
    - kind: fixed
      description: Resolve in-cluster ExternalName aliases for Go Kubernetes clients while preserving NODATA semantics.
    - kind: fixed
      description: Roll DNS pods on chart upgrades, hot-reload certificates, and retry verified DoH during certificate projection.
    - kind: fixed
      description: Make the Helm DNS health test independent of cluster DNS and preserve rollback service accounts during migration.
    - kind: fixed
      description: Preserve private-zone conditional forwarding and expose native DNS health metrics without restoring any CoreDNS dependency.
    - kind: added
      description: Replace the K3s CoreDNS dependency with an Advanced Fabric authoritative Kubernetes DNS and DoH service backed by Service and EndpointSlice watches.
    - kind: fixed
      description: Make observe-only agent execution strictly read-only and defer mutation transaction validation until guarded apply.
    - kind: added
      description: Long-term VictoriaMetrics service discovery with measurement-only defaults and explicit enforcement opt-in.
    - kind: added
      description: Per-node network-intelligence triangle evidence for path optimality, stability and failure independence.
    - kind: fixed
      description: Match the K3s CoreDNS runtime security context so the binary can execute and bind privileged DNS port 53.
    - kind: fixed
      description: Use the K3s CoreDNS 1.14.2 mirror tag because Docker Hub no longer resolves the historical manifest-list digest across nodes.
    - kind: fixed
      description: Pin the DNS and DoH canary to the verified multi-architecture K3s CoreDNS 1.14.2 mirror digest.
    - kind: fixed
      description: Remove quadratic uniqueItems validation from RouterOSNode CRD arrays for Kubernetes API compatibility.
    - kind: added
      description: Directed host/pod network conformance matrix and UDP/TCP DNS quality gates.
    - kind: added
      description: Observe-first RouterOSNode v1alpha2 route-domain isolation and checksum-bound reconciliation.
    - kind: added
      description: Per-node BGP candidate, best and multipath RIB evidence for the Headlamp tables.
    - kind: added
      description: Node selector with structured kernel ECMP, path-decision and peer-inventory tables.
    - kind: fixed
      description: Build the Advanced Fabric Headlamp plugin with the supported Headlamp 0.14 toolchain.
    - kind: added
      description: Headlamp plugin and live per-node native routing, FRR, BGP/BFD and ECMP status publication.
    - kind: added
      description: Seven-spine A/B/C inventory and deny-by-default FRR policy model.
    - kind: added
      description: Observe-only TrafficPolicy economics controller and host validation agent.
    - kind: changed
      description: Native routing is standardized on 10.42.0.0/16 with cross-WAN direct-node routes disabled.
    - kind: changed
      description: The canonical private image registry endpoint is registry.re8ch.com on HTTPS port 443.
  artifacthub.io/crds: |
    - kind: RouterOSNode
      version: v1alpha2
      name: routerosnodes.networking.advfab.org
      displayName: RouterOS route-domain boundary
      description: Role-scoped eBGP peers, protected prefixes and static public VIP fallback intent.
    - kind: AdvancedFabric
      version: v1alpha1
      name: advancedfabrics.networking.advfab.org
      displayName: Advanced Fabric inventory
      description: Static spine/leaf authority, capacity and failure-domain inventory.
    - kind: TrafficPolicy
      version: v1alpha1
      name: trafficpolicies.networking.advfab.org
      displayName: Traffic Policy
      description: Namespace-scoped fastest, balanced or greedy egress intent.
    - kind: NetworkPathAssessment
      version: v1alpha2
      name: networkpathassessments.networking.advfab.org
      displayName: Network Path Assessment
      description: Consumer-neutral, freshness-bounded path eligibility evidence for an active subject.
    - kind: NetworkIntervention
      version: v1alpha1
      name: networkinterventions.networking.advfab.org
      displayName: Network Intervention
      description: Automatically discovered change candidate awaiting aligned experimental windows.
    - kind: NetworkTradeoffEstimate
      version: v1alpha1
      name: networktradeoffestimates.networking.advfab.org
      displayName: Network Trade-off Estimate
      description: Evidence-bounded finite-difference estimate with explicit identification state.
    - kind: TradeoffTriangle
      version: v1alpha1
      name: tradeofftriangles.networking.advfab.org
      displayName: Trade-off Triangle
      description: A configurable three-variable hypothesis that closes only with identified evidence.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/re8ch/advanced-fabric
    - name: support
      url: https://github.com/re8ch/advanced-fabric/issues
