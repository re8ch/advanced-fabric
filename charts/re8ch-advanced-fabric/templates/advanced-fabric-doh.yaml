{{- if and .Values.advancedFabric.enabled .Values.advancedFabric.networkQuality.enabled (or .Values.advancedFabric.networkQuality.doh.enabled .Values.advancedFabric.networkQuality.dns.shadowEnabled) }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: advanced-fabric-doh, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: advanced-fabric-doh}
rules:
  - apiGroups: [""]
    resources: [endpoints, namespaces, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: advanced-fabric-doh}
subjects: [{kind: ServiceAccount, name: advanced-fabric-doh, namespace: kube-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: advanced-fabric-doh}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: advanced-fabric-doh-selfsigned, namespace: kube-system}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: advanced-fabric-doh, namespace: kube-system}
spec:
  secretName: {{ .Values.advancedFabric.networkQuality.doh.caSecretName }}
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  dnsNames:
    - advanced-fabric-doh.kube-system.svc
    - advanced-fabric-doh.kube-system.svc.cluster.local
  issuerRef: {name: advanced-fabric-doh-selfsigned, kind: Issuer}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: advanced-fabric-doh, namespace: kube-system}
data:
  Corefile: |
    .:53 {
        errors
        health :8080
        ready :8181
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods verified
            fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/k3s-coredns/NodeHosts {
            ttl 60
            reload 15s
            fallthrough
        }
        prometheus :9153
        cache {
            success 9984 30
            denial 9984 5
        }
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . /etc/resolv.conf {
            policy sequential
            health_check 5s
            max_fails 1
            max_concurrent 1000
        }
    }
    https://.:8443 {
        tls /tls/tls.crt /tls/tls.key
        https {
            max_connections 200
        }
        errors
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods verified
            fallthrough in-addr.arpa ip6.arpa
        }
        prometheus :9153
        cache {
            success 9984 30
            denial 9984 5
        }
        loop
        reload
        loadbalance
        forward . /etc/resolv.conf {
            policy sequential
            health_check 5s
            max_fails 1
            max_concurrent 500
        }
    }
    import /etc/coredns/custom/*.server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-fabric-doh
  namespace: kube-system
  labels: {app.kubernetes.io/name: advanced-fabric-doh, app.kubernetes.io/part-of: re8ch-advanced-fabric}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-doh}}
  template:
    metadata: {labels: {app.kubernetes.io/name: advanced-fabric-doh, app.kubernetes.io/part-of: re8ch-advanced-fabric}}
    spec:
      serviceAccountName: advanced-fabric-doh
      priorityClassName: system-cluster-critical
      dnsPolicy: Default
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-doh}}}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists}
        - {key: node-role.kubernetes.io/master, operator: Exists}
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.3@sha256:b21d26b915e10acb5bc78715c1e8b6047ab2675389b2bcc18b3a6499d90e74c0
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - {name: dns, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: doh, containerPort: 8443, protocol: TCP}
            - {name: health, containerPort: 8080, protocol: TCP}
            - {name: ready, containerPort: 8181, protocol: TCP}
            - {name: metrics, containerPort: 9153, protocol: TCP}
          readinessProbe: {httpGet: {path: /ready, port: ready}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: health}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 2}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532}
          volumeMounts:
            - {name: config, mountPath: /etc/coredns, readOnly: true}
            - {name: k3s-coredns, mountPath: /etc/k3s-coredns, readOnly: true}
            - {name: custom, mountPath: /etc/coredns/custom, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - {name: config, configMap: {name: advanced-fabric-doh}}
        - {name: k3s-coredns, configMap: {name: coredns}}
        - {name: custom, configMap: {name: coredns-custom, optional: true}}
        - {name: tls, secret: {secretName: {{ .Values.advancedFabric.networkQuality.doh.caSecretName }}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: advanced-fabric-dns, namespace: kube-system}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-doh}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.advancedFabric.networkQuality.dns.shadowServiceName }}
  namespace: kube-system
  labels: {app.kubernetes.io/name: advanced-fabric-dns, app.kubernetes.io/part-of: re8ch-advanced-fabric}
spec:
  selector: {app.kubernetes.io/name: advanced-fabric-doh}
  ports:
    - {name: dns, port: 53, targetPort: dns, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
    - {name: metrics, port: 9153, targetPort: metrics, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: advanced-fabric-doh
  namespace: kube-system
  labels: {app.kubernetes.io/name: advanced-fabric-doh, app.kubernetes.io/part-of: re8ch-advanced-fabric}
spec:
  selector: {app.kubernetes.io/name: advanced-fabric-doh}
  ports:
    - {name: https, port: 443, targetPort: doh, protocol: TCP}
    - {name: metrics, port: 9153, targetPort: metrics, protocol: TCP}
{{- end }}
