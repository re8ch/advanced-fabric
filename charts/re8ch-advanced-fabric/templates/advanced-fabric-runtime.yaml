{{- if .Values.advancedFabric.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: advanced-fabric, namespace: {{ .Values.advancedFabric.runtimeNamespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: advanced-fabric}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, patch, update]
  - apiGroups: [{{ .Values.advancedFabric.apiGroup }}, {{ .Values.advancedFabric.legacyApiGroup }}]
    resources: [advancedfabrics, trafficpolicies]
    verbs: [get, list, watch]
  - apiGroups: [{{ .Values.advancedFabric.apiGroup }}, {{ .Values.advancedFabric.legacyApiGroup }}]
    resources: [networkpathassessments, networkinterventions, networkobservationepisodes, networktradeoffestimates, tradeofftriangles]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [{{ .Values.advancedFabric.apiGroup }}, {{ .Values.advancedFabric.legacyApiGroup }}]
    resources: [advancedfabrics/status, trafficpolicies/status, networkpathassessments/status, networkinterventions/status, networkobservationepisodes/status, tradeofftriangles/status]
    verbs: [get, patch, update]
{{- if .Values.advancedFabric.virtualIngress.enabled }}
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [get, patch, update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    verbs: [get, list, watch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: advanced-fabric}
subjects:
  - {kind: ServiceAccount, name: advanced-fabric, namespace: {{ .Values.advancedFabric.runtimeNamespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: advanced-fabric}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: advanced-fabric-runtime, namespace: {{ .Values.advancedFabric.runtimeNamespace }}}
data:
  controller.py: |
{{ .Files.Get "files/controller.py" | indent 4 }}
  observation-api.py: |
{{ .Files.Get "files/observation-api.py" | indent 4 }}
  host-agent.sh: |
{{ .Files.Get "files/host-agent.sh" | indent 4 }}
  status-publisher.py: |
{{ .Files.Get "files/status-publisher.py" | indent 4 }}
  conformance-probe.py: |
{{ .Files.Get "files/conformance-probe.py" | indent 4 }}
  node-measurement.py: |
{{ .Files.Get "files/node-measurement.py" | indent 4 }}
  service-traffic-window.sh: |
{{ .Files.Get "files/service-traffic-window.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-fabric-controller
  namespace: {{ .Values.advancedFabric.runtimeNamespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-controller}}
  template:
    metadata:
      annotations:
        checksum/runtime: {{ printf "%s\n%s\n%s\n%s\n%s\n%s\n%s" (.Files.Get "files/controller.py") (.Files.Get "files/observation-api.py") (.Files.Get "files/host-agent.sh") (.Files.Get "files/status-publisher.py") (.Files.Get "files/conformance-probe.py") (.Files.Get "files/node-measurement.py") (.Files.Get "files/service-traffic-window.sh") | sha256sum | quote }}
      labels: {app.kubernetes.io/name: advanced-fabric-controller}
    spec:
      serviceAccountName: advanced-fabric
      priorityClassName: system-cluster-critical
{{- with .Values.advancedFabric.controller.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: controller
          image: {{ .Values.advancedFabric.controller.image }}
          command: [python3, /runtime/controller.py]
          env:
            - {name: ADVISOR_URL, value: {{ .Values.advancedFabric.controller.advisorURL | quote }}}
            - {name: ADVANCED_FABRIC_API_GROUP, value: {{ .Values.advancedFabric.apiGroup | quote }}}
            - {name: ADVANCED_FABRIC_LEGACY_API_GROUP, value: {{ .Values.advancedFabric.legacyApiGroup | quote }}}
            - {name: ADVANCED_FABRIC_LEGACY_INSTANCE, value: "re8ch"}
            - {name: ADVANCED_FABRIC_INSTANCE, value: {{ .Values.advancedFabric.instanceName | quote }}}
            - {name: OBSERVATION_API_SERVICE, value: {{ .Values.advancedFabric.componentAPI.serviceName | quote }}}
            - {name: OBSERVATION_API_PORT, value: {{ .Values.advancedFabric.componentAPI.port | quote }}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          volumeMounts: [{name: runtime, mountPath: /runtime, readOnly: true}, {name: tmp, mountPath: /tmp}]
        - name: observation-api
          image: {{ .Values.advancedFabric.controller.image }}
          command: [python3, /runtime/observation-api.py]
          env:
            - {name: ADVANCED_FABRIC_API_GROUP, value: {{ .Values.advancedFabric.apiGroup | quote }}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: OBSERVATION_API_PORT, value: {{ .Values.advancedFabric.componentAPI.port | quote }}}
          ports: [{name: observation-api, containerPort: {{ .Values.advancedFabric.componentAPI.port }}}]
          readinessProbe: {httpGet: {path: /healthz, port: observation-api}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts: [{name: runtime, mountPath: /runtime, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: runtime, configMap: {name: advanced-fabric-runtime, defaultMode: 365}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.advancedFabric.componentAPI.serviceName }}
  namespace: {{ .Values.advancedFabric.runtimeNamespace }}
  labels: {app.kubernetes.io/name: advanced-fabric-observation-api, app.kubernetes.io/part-of: advanced-fabric}
spec:
  selector: {app.kubernetes.io/name: advanced-fabric-controller}
  ports: [{name: http, port: {{ .Values.advancedFabric.componentAPI.port }}, targetPort: observation-api}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: advanced-fabric-agent, namespace: {{ .Values.advancedFabric.runtimeNamespace }}}
spec:
  # Status collection must continue converging when a minority of retained
  # nodes are offline; an unavailable node must not pin every healthy agent.
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 25%}}
  selector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-agent}}
  template:
    metadata:
      annotations:
        checksum/runtime: {{ printf "%s\n%s\n%s\n%s\n%s\n%s\n%s" (.Files.Get "files/controller.py") (.Files.Get "files/observation-api.py") (.Files.Get "files/host-agent.sh") (.Files.Get "files/status-publisher.py") (.Files.Get "files/conformance-probe.py") (.Files.Get "files/node-measurement.py") (.Files.Get "files/service-traffic-window.sh") | sha256sum | quote }}
      labels: {app.kubernetes.io/name: advanced-fabric-agent}
    spec:
      serviceAccountName: advanced-fabric
      hostPID: true
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      containers:
        - name: service-traffic-window
          image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
          command: [/bin/sh, /runtime/service-traffic-window.sh]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: SERVICE_TRAFFIC_WINDOW_SECONDS, value: "15"}
          securityContext: {privileged: true}
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: host, mountPath: /host, readOnly: true}
            - {name: status, mountPath: /status}
        - name: agent
          image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
          command: [/bin/sh, /runtime/host-agent.sh]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
          securityContext: {privileged: true}
          readinessProbe: {exec: {command: [/usr/bin/test, -f, /run/advanced-fabric-ready]}, periodSeconds: 10}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: desired, mountPath: /desired, readOnly: true}
            - {name: host, mountPath: /host}
            - {name: status, mountPath: /status}
        - name: publisher
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python3, /runtime/status-publisher.py]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 5m, memory: 12Mi}, limits: {cpu: 50m, memory: 32Mi}}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: status, mountPath: /status, readOnly: true}
        - name: node-measurement
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python3, /runtime/node-measurement.py]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: MEASUREMENT_INTERVAL_SECONDS, value: "15"}
            - {name: MEASUREMENT_FRESHNESS_SECONDS, value: {{ .Values.advancedFabric.networkQuality.freshnessSeconds | quote }} }
            - {name: MEASUREMENT_HORIZON_SECONDS, value: "7776000"}
{{- if .Values.advancedFabric.networkQuality.enabled }}
            - {name: TEXTFILE_DIR, value: /metrics}
{{- end }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 50m, memory: 48Mi}}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: status, mountPath: /status}
{{- if .Values.advancedFabric.networkQuality.enabled }}
            - {name: network-quality-metrics, mountPath: /metrics}
{{- end }}
{{- if .Values.advancedFabric.networkQuality.enabled }}
        - name: host-conformance
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python3, /runtime/conformance-probe.py]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: SOURCE_PLANE, value: host}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: ADVANCED_FABRIC_API_GROUP, value: {{ .Values.advancedFabric.apiGroup | quote }}}
            - {name: ADVANCED_FABRIC_INSTANCE, value: {{ .Values.advancedFabric.instanceName | quote }}}
            - {name: DNS_SERVICE, value: {{ .Values.advancedFabric.dns.service.name | quote }}}
            - {name: PROBE_INTERVAL_SECONDS, value: {{ .Values.advancedFabric.networkQuality.intervalSeconds | quote }}}
            - {name: PROBE_TIMEOUT_SECONDS, value: {{ .Values.advancedFabric.networkQuality.timeoutSeconds | quote }}}
            - {name: PROBE_SAMPLES, value: {{ .Values.advancedFabric.networkQuality.samples | quote }}}
            - {name: PROBE_MAX_CONCURRENCY, value: {{ .Values.advancedFabric.networkQuality.maximumConcurrency | quote }}}
{{- if .Values.advancedFabric.networkQuality.dns.shadowEnabled }}
            - {name: SHADOW_DNS_SERVICE, value: {{ .Values.advancedFabric.networkQuality.dns.shadowServiceName | quote }}}
{{- end }}
{{- if .Values.advancedFabric.networkQuality.doh.enabled }}
            - {name: DOH_URL, value: {{ .Values.advancedFabric.networkQuality.doh.url | quote }}}
            - {name: DOH_CA_FILE, value: /doh-ca/tls.crt}
{{- end }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: network-quality-metrics, mountPath: /metrics}
{{- if .Values.advancedFabric.networkQuality.doh.enabled }}
            - {name: doh-ca, mountPath: /doh-ca, readOnly: true}
{{- end }}
        - name: network-quality-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
          args: [--web.listen-address=:19101, --collector.disable-defaults, --collector.textfile, --collector.textfile.directory=/metrics]
          ports: [{name: metrics, containerPort: 19101}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65534}
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 50m, memory: 48Mi}}
          volumeMounts: [{name: network-quality-metrics, mountPath: /metrics, readOnly: true}]
{{- end }}
      volumes:
        - {name: runtime, configMap: {name: advanced-fabric-runtime, defaultMode: 365}}
        - {name: desired, configMap: {name: advanced-fabric-desired, optional: true}}
        - {name: host, hostPath: {path: /, type: Directory}}
        - {name: status, emptyDir: {}}
{{- if .Values.advancedFabric.networkQuality.enabled }}
        - {name: network-quality-metrics, hostPath: {path: /var/lib/advanced-fabric/textfile, type: DirectoryOrCreate}}
{{- if .Values.advancedFabric.networkQuality.doh.enabled }}
        - {name: doh-ca, secret: {secretName: {{ .Values.advancedFabric.networkQuality.doh.caSecretName }}}}
{{- end }}
{{- end }}
{{- if .Values.advancedFabric.networkQuality.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: advanced-fabric-node-exporter
  namespace: {{ .Values.advancedFabric.runtimeNamespace }}
  labels: {app.kubernetes.io/name: advanced-fabric-node-exporter, app.kubernetes.io/part-of: advanced-fabric}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: advanced-fabric-agent}
  ports: [{name: metrics, port: 19101, targetPort: metrics}]
{{- if and .Values.advancedFabric.networkQuality.victoriaMetricsServiceScrape (.Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1/VMServiceScrape") }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: advanced-fabric-network-quality
  namespace: {{ .Values.advancedFabric.runtimeNamespace }}
  labels: {app.kubernetes.io/name: advanced-fabric-network-quality, app.kubernetes.io/part-of: advanced-fabric}
spec:
  namespaceSelector: {matchNames: [{{ .Values.advancedFabric.runtimeNamespace }}]}
  selector:
    matchLabels: {app.kubernetes.io/name: advanced-fabric-node-exporter}
  endpoints:
    - port: metrics
      interval: {{ .Values.advancedFabric.networkQuality.intervalSeconds }}s
      scrapeTimeout: 10s
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: advanced-fabric-pod-conformance, namespace: {{ .Values.advancedFabric.runtimeNamespace }}}
spec:
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 25%}}
  selector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-pod-conformance}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: advanced-fabric-pod-conformance}
      annotations:
        checksum/runtime: {{ .Files.Get "files/conformance-probe.py" | sha256sum | quote }}
    spec:
      serviceAccountName: advanced-fabric
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      containers:
        - name: pod-conformance
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python3, /runtime/conformance-probe.py]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: SOURCE_PLANE, value: pod}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: ADVANCED_FABRIC_API_GROUP, value: {{ .Values.advancedFabric.apiGroup | quote }}}
            - {name: ADVANCED_FABRIC_INSTANCE, value: {{ .Values.advancedFabric.instanceName | quote }}}
            - {name: DNS_SERVICE, value: {{ .Values.advancedFabric.dns.service.name | quote }}}
            - {name: PROBE_INTERVAL_SECONDS, value: {{ .Values.advancedFabric.networkQuality.intervalSeconds | quote }}}
            - {name: PROBE_TIMEOUT_SECONDS, value: {{ .Values.advancedFabric.networkQuality.timeoutSeconds | quote }}}
            - {name: PROBE_SAMPLES, value: {{ .Values.advancedFabric.networkQuality.samples | quote }}}
            - {name: PROBE_MAX_CONCURRENCY, value: {{ .Values.advancedFabric.networkQuality.maximumConcurrency | quote }}}
{{- if .Values.advancedFabric.networkQuality.dns.shadowEnabled }}
            - {name: SHADOW_DNS_SERVICE, value: {{ .Values.advancedFabric.networkQuality.dns.shadowServiceName | quote }}}
{{- end }}
{{- if .Values.advancedFabric.networkQuality.doh.enabled }}
            - {name: DOH_URL, value: {{ .Values.advancedFabric.networkQuality.doh.url | quote }}}
            - {name: DOH_CA_FILE, value: /doh-ca/tls.crt}
{{- end }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: network-quality-metrics, mountPath: /metrics}
{{- if .Values.advancedFabric.networkQuality.doh.enabled }}
            - {name: doh-ca, mountPath: /doh-ca, readOnly: true}
{{- end }}
      volumes:
        - {name: runtime, configMap: {name: advanced-fabric-runtime, defaultMode: 365}}
        - {name: network-quality-metrics, hostPath: {path: /var/lib/advanced-fabric/textfile, type: DirectoryOrCreate}}
{{- if .Values.advancedFabric.networkQuality.doh.enabled }}
        - {name: doh-ca, secret: {secretName: {{ .Values.advancedFabric.networkQuality.doh.caSecretName }}}}
{{- end }}
{{- end }}
{{- end }}
