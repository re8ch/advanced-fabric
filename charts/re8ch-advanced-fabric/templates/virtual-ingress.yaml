{{- if and .Values.advancedFabric.enabled .Values.advancedFabric.virtualIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.advancedFabric.virtualIngress.className }}
  labels: {app.kubernetes.io/part-of: advanced-fabric}
spec:
  controller: networking.advfab.org/advanced-fabric-gateway
---
apiVersion: v1
kind: ConfigMap
metadata: {name: advanced-fabric-virtual-ingress, namespace: kube-system}
data:
  controller.py: |
{{ .Files.Get "files/virtual-ingress-controller.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: advanced-fabric-virtual-ingress, namespace: kube-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: advanced-fabric-virtual-ingress}}
  template:
    metadata:
      annotations: {checksum/runtime: {{ .Files.Get "files/virtual-ingress-controller.py" | sha256sum | quote }}}
      labels: {app.kubernetes.io/name: advanced-fabric-virtual-ingress, app.kubernetes.io/part-of: advanced-fabric}
    spec:
      serviceAccountName: advanced-fabric
      priorityClassName: system-cluster-critical
      containers:
        - name: controller
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python3, /runtime/controller.py]
          env:
            - {name: INGRESS_CLASS, value: {{ .Values.advancedFabric.virtualIngress.className | quote }}}
            - {name: GATEWAY_NAME, value: {{ .Values.advancedFabric.virtualIngress.gateway.name | quote }}}
            - {name: GATEWAY_NAMESPACE, value: {{ .Values.advancedFabric.virtualIngress.gateway.namespace | quote }}}
            - {name: GATEWAY_SECTION, value: {{ .Values.advancedFabric.virtualIngress.gateway.sectionName | quote }}}
            - {name: PUBLIC_ADDRESS, value: {{ .Values.advancedFabric.virtualIngress.publicAddress | quote }}}
            - {name: RECONCILE_INTERVAL_SECONDS, value: {{ .Values.advancedFabric.virtualIngress.reconcileIntervalSeconds | quote }}}
            - {name: ADOPT_ENABLED, value: {{ .Values.advancedFabric.virtualIngress.adoption.enabled | quote }}}
            - {name: ADOPT_SOURCE_CLASS, value: {{ .Values.advancedFabric.virtualIngress.adoption.sourceClassName | quote }}}
            - {name: ADOPT_EXCLUSIONS, value: {{ join "," .Values.advancedFabric.virtualIngress.adoption.exclusions | quote }}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65534}
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts: [{name: runtime, mountPath: /runtime, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: runtime, configMap: {name: advanced-fabric-virtual-ingress, defaultMode: 365}}, {name: tmp, emptyDir: {}}]
{{- end }}
