apiVersion: networking.re8ch.com/v1alpha1
kind: MeasurementCatalog
metadata:
  name: advanced-fabric-osi-identification
spec:
  principle: Raw observations and structural estimands precede O/S/I scoring.
  requiredFields: [symbol, meaning, source, unit, samplingMethod, scope, timeWindow, validityConditions, uncertainty]
  methodologyRequirements:
    - Preserve singleton observations, sample streams, and summary statistics as separate objects.
    - Record the packet or flow Type-P parameters including protocol, address family, packet size, DSCP/traffic class, ports, and payload behavior.
    - State whether scheduling is periodic, Poisson, event-triggered, passive, or hybrid; do not compare unlike schedules without a model.
    - Record the loss waiting threshold separately from delay and preserve undefined/lost observations outside the successful-delay distribution.
    - Label one-way and round-trip delay distinctly and report clock synchronization and timestamp uncertainty for one-way measurements.
    - Separate BGP control-plane convergence, RIB convergence, FIB installation, and observed forwarding convergence.
    - Give every counter a monotonicity/reset epoch and every event stream a sequence-gap indicator.
    - Correlate metrics, events, logs, and flows with the same node, VRF, prefix, peer, path, service, experiment, and clock metadata.
  measurements:
    - {symbol: x_nh, meaning: selected next-hop identity for a destination prefix, source: Linux rtnetlink/ip-route JSON and FRR FIB, unit: categorical address/interface tuple, samplingMethod: snapshot plus change event, scope: node/VRF/prefix/address-family, timeWindow: event and aligned snapshot, validityConditions: route lookup succeeds and table/VRF is explicit, uncertainty: policy routing and per-flow hashing may select a different realized path}
    - {symbol: p_route, meaning: route preference attributes governing selection, source: Linux route metric/protocol and FRR local-pref/MED/weight/AS-path, unit: attribute vector, samplingMethod: snapshot every interval and on RIB event, scope: node/VRF/prefix/candidate route, timeWindow: instantaneous with retained history, validityConditions: all compared candidates use the same address-family and table, uncertainty: vendor tie-breakers and hidden policy may remain unobserved}
    - {symbol: w_ecmp, meaning: installed ECMP next-hop width, source: Linux nexthop and route JSON plus FRR FIB, unit: next-hops, samplingMethod: enumerate unique installed weighted next-hops, scope: node/VRF/prefix, timeWindow: snapshot and dwell interval, validityConditions: next-hops are installed and link-up, uncertainty: installed does not prove simultaneously usable or equally exercised}
    - {symbol: m_route, meaning: multiplicity of candidate routes before best-path selection, source: FRR BGP RIB JSON, unit: candidate paths, samplingMethod: enumerate paths for each prefix, scope: node/VRF/prefix/address-family, timeWindow: snapshot and dwell interval, validityConditions: FRR query is complete and not truncated, uncertainty: non-BGP kernel candidates and add-path visibility can differ}
    - {symbol: n_path_change, meaning: selected next-hop or installed path-set transitions, source: rtnetlink route events and FRR best-path events, unit: transitions, samplingMethod: event count with before/after state hash, scope: node/VRF/prefix, timeWindow: fixed observation window, validityConditions: continuous event stream with known restart epochs, uncertainty: missed events and collector restarts undercount transitions}
    - {symbol: d_mode, meaning: Cilium forwarding mode and native/tunnel datapath state, source: Cilium status/config and Linux link inventory, unit: categorical mode plus interface set, samplingMethod: snapshot on config generation and periodically, scope: node, timeWindow: configuration epoch, validityConditions: Cilium agent is reachable and effective config is reported, uncertainty: declared mode does not prove the path taken by an individual flow}
    - {symbol: a_reach, meaning: successful end-to-end reachability trial, source: host/pod active probe and Cilium/Hubble drop evidence, unit: Bernoulli outcome, samplingMethod: repeated same-target trials from named source plane, scope: source node/plane to destination endpoint/protocol/port, timeWindow: completed probe batch, validityConditions: target and protocol are identical across comparisons, uncertainty: finite sampling and application refusal can be confused with forwarding failure}
    - {symbol: l_path, meaning: packet or connection loss ratio, source: host/pod active probe or counters with explicit denominator, unit: ratio, samplingMethod: failures divided by attempted probes in a completed batch, scope: directed source plane/path/endpoint/protocol, timeWindow: completed batch, validityConditions: positive attempt count and classified timeouts, uncertainty: confidence interval grows for small samples and correlated loss}
    - {symbol: t_rtt, meaning: forwarding round-trip latency distribution, source: TCP/ICMP/HTTP probe with protocol recorded, unit: milliseconds distribution, samplingMethod: retain count/p50/p95 and preferably raw histogram, scope: directed source plane/path/endpoint/protocol, timeWindow: completed batch, validityConditions: successful samples and synchronized target identity, uncertainty: handshake/application processing and asymmetric return paths contaminate forwarding latency}
    - {symbol: b_rx, meaning: traffic entering a Service and attributed to destination node, source: Cilium/Hubble or Gateway flow counters through a registered adapter, unit: bytes packets and requests per completed window, samplingMethod: counter delta with reset detection, scope: cluster/namespace/Service/destination node/protocol, timeWindow: non-overlapping completed window, validityConditions: stable counter identity and positive duration with no unhandled reset, uncertainty: sampling loss retransmits and encrypted/unsupported paths may be absent}
    - {symbol: b_est, meaning: BGP session established state, source: FRR neighbor JSON, unit: Bernoulli per peer, samplingMethod: event stream plus periodic snapshot, scope: node/VRF/peer/address-family, timeWindow: event and dwell interval, validityConditions: peer identity and VRF are stable, uncertainty: established does not imply useful prefixes or working forwarding}
    - {symbol: n_peer, meaning: configured and established peer counts, source: FRR running config and neighbor JSON, unit: peers split by state, samplingMethod: reconcile configured identities with live sessions, scope: node/VRF/address-family, timeWindow: snapshot, validityConditions: complete config and operational queries, uncertainty: route-server peers can hide downstream dependency sharing}
    - {symbol: n_adv, meaning: prefixes advertised to a peer, source: FRR advertised-routes JSON, unit: prefixes, samplingMethod: enumerate unique NLRI per peer, scope: node/VRF/peer/address-family, timeWindow: snapshot after update settling, validityConditions: query supported and policy epoch recorded, uncertainty: count ignores prefix importance and remote acceptance}
    - {symbol: n_recv, meaning: prefixes received and accepted from a peer, source: FRR received-routes/BGP RIB JSON, unit: prefixes, samplingMethod: enumerate received and accepted NLRI separately, scope: node/VRF/peer/address-family, timeWindow: snapshot after update settling, validityConditions: soft-reconfiguration or equivalent visibility is available, uncertainty: received-before-policy may be unavailable}
    - {symbol: u_bgp, meaning: BGP update events, source: FRR structured log/BMP or neighbor counters, unit: updates, samplingMethod: monotonic delta with restart epoch, scope: node/VRF/peer/address-family, timeWindow: fixed window, validityConditions: no unhandled counter reset and collection is continuous, uncertainty: aggregate counters lose per-prefix causality}
    - {symbol: w_bgp, meaning: BGP withdrawal events, source: FRR structured log/BMP or neighbor counters, unit: withdrawals, samplingMethod: event count or monotonic delta with restart epoch, scope: node/VRF/peer/prefix/address-family, timeWindow: fixed window, validityConditions: explicit withdrawal classification and continuous collection, uncertainty: implicit replacement may not appear as a standalone withdrawal}
    - {symbol: t_conv, meaning: time from controlled routing disturbance to stable RIB/FIB and forwarding, source: experiment event marker plus FRR/rtnetlink/probe timelines, unit: milliseconds or seconds, samplingMethod: treatment timestamp to declared multi-signal stability criterion, scope: experiment/node/VRF/prefix/path, timeWindow: one disturbance episode, validityConditions: clocks aligned treatment isolated and stability criterion pre-registered, uncertainty: censoring and polling interval bound the estimate}
    - {symbol: lambda_flap, meaning: peer or route flap intensity, source: FRR session and best-path event history, unit: events per second, samplingMethod: count qualifying state cycles divided by exposure duration, scope: node/VRF/peer or prefix, timeWindow: rolling and experiment windows, validityConditions: minimum exposure and restart epochs removed, uncertainty: threshold choice and missed short flaps bias the rate}
    - {symbol: delta_ribfib, meaning: RIB/FIB state-set changes, source: FRR RIB/FIB snapshots and Linux rtnetlink events, unit: additions removals replacements, samplingMethod: canonical state hash and set difference per event, scope: node/VRF/prefix, timeWindow: event sequence, validityConditions: canonicalization and complete snapshots, uncertainty: snapshot cadence can collapse multiple transitions}
    - {symbol: n_nh, meaning: distinct currently viable next-hops, source: Linux/FRR candidates corroborated by same-window probes, unit: viable next-hops, samplingMethod: set cardinality after per-next-hop viability tests, scope: node/VRF/prefix/protocol, timeWindow: aligned viability window, validityConditions: each member tested without changing target semantics, uncertainty: source routing may be required to isolate a member}
    - {symbol: n_if, meaning: distinct egress interfaces among viable alternatives, source: Linux route/nexthop and link state, unit: interfaces, samplingMethod: unique ifindex over viable paths, scope: node/VRF/prefix, timeWindow: aligned snapshot, validityConditions: stable ifindex and operational link, uncertainty: multiple logical interfaces may share one physical dependency}
    - {symbol: n_tun, meaning: distinct tunnel underlays among viable alternatives, source: Cilium status Linux links WireGuard state and declared inventory, unit: tunnel identities, samplingMethod: map viable next-hops to tunnel and underlay identity, scope: node/path set, timeWindow: topology epoch, validityConditions: mapping is observed or verified not merely named, uncertainty: different tunnels can share the same underlay}
    - {symbol: n_gw, meaning: distinct gateways among viable alternatives, source: Linux/FRR next-hop state plus topology inventory, unit: gateways, samplingMethod: unique verified gateway identity, scope: node/VRF/prefix, timeWindow: topology epoch, validityConditions: gateway identity is resolvable and viable, uncertainty: aliases or anycast can hide shared machinery}
    - {symbol: n_asn, meaning: distinct observed upstream ASN dependency sets, source: FRR AS paths and verified inventory, unit: ASN sets, samplingMethod: canonicalize AS paths and dependency overlap, scope: node/VRF/prefix/path set, timeWindow: RIB epoch, validityConditions: AS path is available and not fabricated by local policy, uncertainty: private ASNs route servers and hidden peering obscure physical independence}
    - {symbol: g_dep, meaning: shared routing and failure dependencies, source: observed next-hop/interface/tunnel/ASN graph plus verified operator inventory, unit: attributed dependency graph, samplingMethod: evidence-backed edges with provenance and validity, scope: candidate path set, timeWindow: topology epoch, validityConditions: every asserted edge has source and freshness, uncertainty: unknown dependencies must remain unknown rather than distinct}
    - {symbol: n_alt, meaning: simultaneously viable alternatives for the same destination and service semantics, source: candidate RIB/FIB paths plus controlled per-path probes, unit: alternatives, samplingMethod: intersection of candidates and same-window viability results, scope: source plane/destination/protocol, timeWindow: aligned probe window, validityConditions: alternatives are tested concurrently or within bounded stationarity, uncertainty: probing can perturb paths and hidden shared bottlenecks remain}
    - {symbol: t_state, meaning: timestamp of a discrete state transition, source: FRR/rtnetlink/Cilium/probe event record, unit: UTC timestamp plus monotonic clock, samplingMethod: record at event ingestion with source sequence, scope: node/component/entity/state, timeWindow: event, validityConditions: synchronized wall clock and monotonic ordering, uncertainty: ingestion delay differs from occurrence time}
    - {symbol: t_persist, meaning: duration a selected path or control state persists, source: ordered state events, unit: seconds, samplingMethod: difference between adjacent transition timestamps with right censoring, scope: node/VRF/prefix/state, timeWindow: episode and observation horizon, validityConditions: continuous observation and explicit censoring, uncertainty: missed transitions inflate persistence}
    - {symbol: f_switch, meaning: selected-path switching frequency, source: canonical next-hop/path-set transition series, unit: switches per second, samplingMethod: qualifying transitions divided by exposure, scope: node/VRF/prefix, timeWindow: fixed rolling or experiment window, validityConditions: stable identity and minimum exposure, uncertainty: route equivalence and sampling cadence affect classification}
    - {symbol: t_recover, meaning: latency from impairment onset to restored forwarding criterion, source: controlled fault marker and active reachability/quality probes, unit: milliseconds or seconds, samplingMethod: onset to first sustained recovery interval, scope: experiment/source plane/path/service, timeWindow: one disturbance episode, validityConditions: pre-fault baseline and sustained recovery rule are pre-registered, uncertainty: interval censoring and unrelated repair actions confound attribution}
    - {symbol: a_osc, meaning: oscillation amplitude of path or control response, source: ordered route selection RTT loss and session-state series, unit: variable-specific peak-to-peak or robust deviation, samplingMethod: baseline-relative excursion with variable retained, scope: node/VRF/prefix/metric, timeWindow: disturbance and recovery episode, validityConditions: sampling rate resolves the expected oscillation, uncertainty: amplitude across categorical path identities requires a declared distance metric}
  latentQuantities:
    - {symbol: Q, name: forwarding quality, required: [a_reach, l_path, t_rtt], status: structural estimand; scalar mapping not identified}
    - {symbol: K, name: convergence responsiveness, required: [t_state, t_conv, t_recover, a_reach, delta_ribfib], status: response distribution; scalar mapping not identified}
    - {symbol: H, name: path hysteresis or inertia, required: [p_route, x_nh, t_state, t_persist, f_switch, a_osc], status: treatment-response estimand; requires controlled preference sweeps}
    - {symbol: C, name: control-plane churn, required: [u_bgp, w_bgp, lambda_flap, delta_ribfib, n_path_change, f_switch], status: event process; aggregation weights not identified}
    - {symbol: R, name: route redundancy, required: [w_ecmp, m_route, n_peer, n_nh, n_if, n_alt], status: viable alternative structure; scalar mapping not identified}
    - {symbol: D, name: failure-domain diversity, required: [n_tun, n_gw, n_asn, g_dep, n_alt], status: attributed dependency graph; scalar mapping not identified}
  references:
    - {name: IETF IPPM Framework, url: https://datatracker.ietf.org/doc/rfc2330/}
    - {name: IETF One-Way Delay Metric, url: https://datatracker.ietf.org/doc/rfc7679/}
    - {name: IETF Packet Delay Variation, url: https://datatracker.ietf.org/doc/rfc3393/}
    - {name: IETF Advanced Stream and Sampling Framework, url: https://datatracker.ietf.org/doc/rfc7312/}
    - {name: IETF BGP Convergence Terminology, url: https://datatracker.ietf.org/doc/rfc4098/}
    - {name: IETF BGP Data-Plane Convergence Methodology, url: https://datatracker.ietf.org/doc/rfc7747/}
    - {name: IETF BGP Monitoring Protocol, url: https://datatracker.ietf.org/doc/rfc7854/}
    - {name: IETF Alternate-Marking Method, url: https://datatracker.ietf.org/doc/rfc9341/}
    - {name: IETF IOAM Data Fields, url: https://datatracker.ietf.org/doc/rfc9197/}
    - {name: CNCF Observability Whitepaper, url: https://github.com/cncf/tag-observability/blob/main/whitepaper.md}
    - {name: Cilium Hubble Observability, url: https://docs.cilium.io/en/stable/observability/hubble/}
    - {name: FRRouting BGP Operational Interface, url: https://docs.frrouting.org/en/latest/bgp.html}
    - {name: OpenTelemetry System Network Metrics, url: https://opentelemetry.io/docs/specs/semconv/system/system-metrics/}
